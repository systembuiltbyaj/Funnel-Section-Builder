<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HERO — Hero Variation 3 (wireframe)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" />
<style>
:root {
  --brand: #3f3f46;            /* accents, CTAs, emphasis. Never body text. */
  --brand-contrast: #f5f5f7;   /* text ON a --brand fill */
  --bg: #ffffff;               /* the page ground. Already set on body. */
  --surface: #f5f5f5;          /* cards and raised panels. The ONLY other background. */
  --border: #d4d4d5;           /* hairlines and dividers */
  --text: #0f0f14;             /* body and headings. TEXT ONLY, never a background. */
  --muted: #6a6a6d;            /* secondary text. TEXT ONLY. */
  --font-head: "Inter", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  --font-sub: "Inter", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  --font-body: "Inter", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  --radius: 14px;
  --maxw: 1120px;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
img, video { max-width: 100%; display: block; }
h1, h2, h3 { font-family: var(--font-head); }

/* hero · 01c */
.hero-wire-3 {
  position: relative;
  background: var(--bg);
  padding: 1.5rem 1.5rem 4rem;
  overflow: hidden;
  font-family: var(--font-body);
}
.hero-wire-3 .blob {
  position: absolute;
  border-radius: 50%;
  background: var(--surface);
  opacity: .6;
  z-index: 0;
}
.hero-wire-3 .blob-a { width: 30rem; height: 30rem; top: -8rem; right: -6rem; }
.hero-wire-3 .blob-b { width: 18rem; height: 18rem; bottom: 0; left: -6rem; }

.hero-wire-3 .nav {
  position: relative;
  z-index: 2;
  max-width: var(--maxw);
  margin: 0 auto 2.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: .9rem;
  border-bottom: 1px solid var(--border);
}
.hero-wire-3 .nav-logo {
  width: 6rem; height: 1.5rem;
  background: var(--border);
  border-radius: 6px;
}
.hero-wire-3 .nav-links { display: flex; gap: 1.5rem; }
.hero-wire-3 .nav-links span {
  font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em;
}
.hero-wire-3 .nav-icon {
  width: 1.4rem; height: 1.4rem; border-radius: 50%;
  border: 1px solid var(--border);
}

.hero-wire-3 .wrap {
  position: relative;
  z-index: 2;
  max-width: var(--maxw);
  margin: 0 auto;
  display: grid;
  grid-template-columns: 55% 45%;
  gap: 1.5rem;
}

/* LEFT */
.hero-wire-3 .left {
  position: relative;
  min-height: 26rem;
  border-radius: var(--radius);
  background: var(--surface);
  overflow: hidden;
  display: flex;
  align-items: flex-end;
}
.hero-wire-3 .left::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(0deg, rgba(15,15,20,.55), transparent 60%);
}
.hero-wire-3 .left-glyph {
  position: absolute;
  top: 40%; left: 50%;
  transform: translate(-50%, -50%);
  opacity: .5;
}
.hero-wire-3 .left-cap {
  position: absolute;
  top: 55%; left: 50%;
  transform: translateX(-50%);
  font-size: .65rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
}
.hero-wire-3 .left-content {
  position: relative;
  z-index: 1;
  padding: 1.75rem;
  color: var(--brand-contrast);
}
.hero-wire-3 .eyebrow {
  display: inline-block;
  font-size: .7rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--surface);
  padding: .3rem .75rem;
  border-radius: 999px;
  margin-bottom: .8rem;
}
.hero-wire-3 .headline {
  font-family: var(--font-head);
  font-size: clamp(1.6rem, 3.2vw, 2.4rem);
  font-weight: 700;
  color: var(--text);
  background: var(--surface);
  display: inline-block;
  padding: .1rem .5rem;
  border-radius: 6px;
  line-height: 1.25;
  margin: 0 0 1.2rem;
}
.hero-wire-3 .btn-row { display: flex; gap: .9rem; flex-wrap: wrap; }
.hero-wire-3 .btn {
  border-radius: 999px;
  padding: .8rem 1.5rem;
  font-size: .9rem;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  cursor: pointer;
}
.hero-wire-3 .btn-primary {
  background: var(--brand);
  color: var(--brand-contrast);
  border: none;
}
.hero-wire-3 .btn-secondary {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--surface);
}

/* RIGHT */
.hero-wire-3 .cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}
.hero-wire-3 .card {
  position: relative;
  min-height: 12.4rem;
  border-radius: var(--radius);
  background: var(--surface);
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  transition: transform .3s ease;
}
.hero-wire-3 .card:hover { transform: scale(1.03); }
.hero-wire-3 .card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(0deg, rgba(15,15,20,.5), transparent 55%);
}
.hero-wire-3 .card-body {
  position: relative;
  z-index: 1;
  padding: .9rem;
  width: 100%;
}
.hero-wire-3 .card-cat {
  font-size: .65rem;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--muted);
  background: var(--bg);
  display: inline-block;
  padding: .15rem .5rem;
  border-radius: 4px;
  margin-bottom: .4rem;
}
.hero-wire-3 .card-title {
  font-weight: 700;
  color: var(--text);
  background: var(--bg);
  display: inline-block;
  padding: .05rem .4rem;
  border-radius: 4px;
  font-size: .9rem;
}

.hero-wire-3 .note {
  position: absolute;
  font-family: 'Segoe Script','Bradley Hand',cursive;
  font-size: 13px;
  color: var(--muted);
  z-index: 3;
  max-width: 9rem;
  line-height: 1.3;
}
.hero-wire-3 .note-1 { top: 3.5rem; right: 1rem; text-align: right; }

@media (max-width: 768px) {
  .hero-wire-3 .wrap { grid-template-columns: 1fr; }
  .hero-wire-3 .nav-links { display: none; }
}
@media (max-width: 480px) {
  .hero-wire-3 .cards { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<!-- hero · 01c -->
<section class="hero-wire-3">
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>

  <nav class="nav">
    <div class="nav-logo"></div>
    <div class="nav-links">
      <span>Home</span>
      <span>Features</span>
      <span>Pricing</span>
      <span>About</span>
    </div>
    <div class="nav-icon"></div>
  </nav>

  <div class="note note-1">Show your product, dashboard, or a relevant hero image here.
    <svg width="60" height="40" viewBox="0 0 60 40" style="position:absolute;left:-55px;top:20px;">
      <path d="M55 5 C 30 5, 10 20, 5 35" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arrow3)"/>
      <defs><marker id="arrow3" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#999"/></marker></defs>
    </svg>
  </div>

  <div class="wrap">
    <div class="left">
      <svg class="left-glyph" width="70" height="70" viewBox="0 0 70 70" fill="none">
        <rect x="4" y="4" width="62" height="62" rx="10" stroke="#bbb" stroke-width="2"/>
        <circle cx="24" cy="26" r="7" stroke="#bbb" stroke-width="2"/>
        <path d="M10 55 L28 35 L42 48 L52 36 L62 55 Z" stroke="#bbb" stroke-width="2" fill="none"/>
      </svg>
      <div class="left-cap">PRODUCT / DASHBOARD PREVIEW OR HERO IMAGE</div>
      <div class="left-content">
        <span class="eyebrow">EYEBROW / TAGLINE</span>
        <h1 class="headline">Main Headline Goes Here, Spanning A Few Lines</h1>
        <div class="btn-row">
          <button class="btn btn-primary">▶ Primary CTA →</button>
          <button class="btn btn-secondary">Secondary CTA</button>
        </div>
      </div>
    </div>

    <div class="cards">
      <div class="card">
        <div class="card-body">
          <span class="card-cat">Category</span>
          <div class="card-title">Feature 1</div>
        </div>
      </div>
      <div class="card">
        <div class="card-body">
          <span class="card-cat">Category</span>
          <div class="card-title">Feature 2</div>
        </div>
      </div>
      <div class="card">
        <div class="card-body">
          <span class="card-cat">Category</span>
          <div class="card-title">Feature 3</div>
        </div>
      </div>
      <div class="card">
        <div class="card-body">
          <span class="card-cat">Category</span>
          <div class="card-title">Feature 4</div>
        </div>
      </div>
    </div>
  </div>
</section>
</body>
</html>
