<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>USP — USP Variation 7 (wireframe)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" />
<style>
:root {
  --brand: #3f3f46;            /* accents, CTAs, emphasis. Never body text. */
  --brand-contrast: #f5f5f7;   /* text ON a --brand fill */
  --bg: #ffffff;               /* the page ground. Already set on body. */
  --surface: #f5f5f5;          /* cards and raised panels. The ONLY other background. */
  --border: #d4d4d5;           /* hairlines and dividers */
  --text: #0f0f14;             /* body and headings. TEXT ONLY, never a background. */
  --muted: #6a6a6d;            /* secondary text. TEXT ONLY. */
  --font-head: "Inter", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  --font-sub: "Inter", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  --font-body: "Inter", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  --radius: 14px;
  --maxw: 1120px;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
img, video { max-width: 100%; display: block; }
h1, h2, h3 { font-family: var(--font-head); }

/* usp · 05g */
.usp7 {
  background: var(--bg);
  padding: 100px 24px;
  position: relative;
  overflow: hidden;
}
.usp7__blob {
  position: absolute;
  border-radius: 50%;
  background: var(--surface);
  opacity: 0.6;
  z-index: 0;
}
.usp7__blob--a { width: 420px; height: 420px; top: -180px; left: -160px; }
.usp7__blob--b { width: 320px; height: 320px; bottom: -140px; right: -120px; }

.usp7__wrap {
  max-width: 880px;
  margin: 0 auto;
  text-align: center;
  position: relative;
  z-index: 1;
}

.usp7__eyebrow {
  display: inline-block;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 6px 16px;
  margin-bottom: 20px;
}

.usp7__h2 {
  font-family: var(--font-head);
  font-weight: 600;
  font-style: normal;
  font-size: clamp(36px, 5vw, 56px);
  line-height: 1.15;
  color: var(--text);
  margin: 0;
}
.usp7__h2 em {
  display: block;
  font-style: italic;
  color: var(--muted);
}

.usp7__body {
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.7;
  color: var(--muted);
  max-width: 640px;
  margin: 24px auto 0;
}

.usp7__pills {
  margin-top: 40px;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 14px;
}

.usp7__pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border-radius: 999px;
  padding: 12px 22px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
}

.usp7__pill svg { width: 16px; height: 16px; stroke: var(--muted); flex-shrink: 0; }

.usp7__note {
  position: absolute;
  font-family: 'Segoe Script', 'Bradley Hand', cursive;
  font-size: 13px;
  color: var(--muted);
  max-width: 160px;
  text-align: left;
  line-height: 1.3;
  z-index: 2;
}
.usp7__note--pills {
  top: 250px;
  right: 0;
}
.usp7__note svg { position: absolute; top: -28px; left: -30px; }

@media (max-width: 768px) {
  .usp7__pills {
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .usp7__note--pills { display: none; }
}

@media (prefers-reduced-motion: no-preference) {
  .usp7__h2, .usp7__body, .usp7__pill {
    animation: usp7fade 0.6s ease both;
  }
  .usp7__body { animation-delay: 0.15s; }
  .usp7__pill:nth-child(1) { animation-delay: 0.28s; }
  .usp7__pill:nth-child(2) { animation-delay: 0.40s; }
  .usp7__pill:nth-child(3) { animation-delay: 0.52s; }
}
@keyframes usp7fade {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<!-- usp · 05g -->
<section class="usp7">
  <div class="usp7__blob usp7__blob--a"></div>
  <div class="usp7__blob usp7__blob--b"></div>

  <div class="usp7__wrap">
    <span class="usp7__eyebrow">EYEBROW / TAGLINE</span>

    <h2 class="usp7__h2">
      Main Headline Goes Here
      <em>Second Line In Accent Style</em>
    </h2>

    <p class="usp7__body">
      A short and clear value proposition that explains your offer and the main benefit.
    </p>

    <div class="usp7__pills">
      <span class="usp7__pill">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>
        Feature 1
      </span>
      <span class="usp7__pill">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>
        Feature 2
      </span>
      <span class="usp7__pill">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><rect x="6" y="10" width="3" height="10"/><rect x="11" y="6" width="3" height="14"/><rect x="16" y="13" width="3" height="7"/></svg>
        Feature 3
      </span>
    </div>

    <div class="usp7__note usp7__note--pills">
      <svg width="40" height="40" viewBox="0 0 40 40"><path d="M35 5 Q10 5 10 30" fill="none" stroke="#9a9a9a" stroke-width="1.5"/></svg>
      Highlight the three key benefit pills here
    </div>
  </div>
</section>
</body>
</html>
